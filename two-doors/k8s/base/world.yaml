# The outside world, played inside the cluster. In real life these are hosts
# on the internet; here they are Services in namespaces the agent has no
# business in, which is what makes the egress rules mean something.
apiVersion: v1
kind: Namespace
metadata:
  name: internet
---
apiVersion: v1
kind: Namespace
metadata:
  name: attacker
---
# The model provider's own copy of its key: what it checks on every call.
apiVersion: v1
kind: Secret
metadata:
  name: provider-key
  namespace: internet
stringData:
  key: sk-demo-provider-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider
  namespace: internet
spec:
  selector: { matchLabels: { app: provider } }
  template:
    metadata: { labels: { app: provider } }
    spec:
      containers:
        - name: provider
          image: two-doors:dev
          command: [/bin/provider]
          env:
            - name: PROVIDER_API_KEY
              valueFrom: { secretKeyRef: { name: provider-key, key: key } }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: provider
  namespace: internet
spec:
  selector: { app: provider }
  ports: [{ port: 80, targetPort: 8080 }]
---
# advisories (the page with the injection) and tickets (the one place the
# agent is meant to write to) are the same pod answering by Host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: internet
spec:
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: two-doors:dev
          command: [/bin/internet]
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: advisories
  namespace: internet
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: tickets
  namespace: internet
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: attacker
spec:
  selector: { matchLabels: { app: collector } }
  template:
    metadata: { labels: { app: collector } }
    spec:
      containers:
        - name: collector
          image: two-doors:dev
          command: [/bin/internet]
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: attacker
spec:
  selector: { app: collector }
  ports: [{ port: 80, targetPort: 8080 }]
